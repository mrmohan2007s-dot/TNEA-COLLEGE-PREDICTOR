<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TNEA College Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>TNEA College Predictor</h1>

    <div class="predictor-inputs">
      <input type="number" id="mark" placeholder="Enter your mark (out of 200)" min="0" max="200" step="0.1" />
      <select id="caste">
        <option value="OC">OC</option>
        <option value="BC">BC</option>
        <option value="MBC">MBC</option>
        <option value="SC">SC</option>
        <option value="ST">ST</option>
      </select>
      <select id="department">
        <option value="">Any Department</option>
        <!-- Departments will be loaded dynamically -->
      </select>
      <input type="text" id="code" placeholder="Counselling Code (optional)" />
      <button onclick="predict()">Find Colleges</button>
    </div>

    <div id="results"></div>

    <div id="recommendation-section" class="hidden mt-6">
      <h2>Recommended College Order</h2>
      <div id="recommendation-output" class="bg-yellow-50 p-4 rounded-md whitespace-pre-line"></div>
      <button onclick="downloadPDF()" class="mt-4 bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded flex items-center justify-center gap-2">
        <span>Download PDF</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
